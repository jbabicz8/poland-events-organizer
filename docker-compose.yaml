services:
  db:
    image: postgres:16
    container_name: events-db
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: events-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data: