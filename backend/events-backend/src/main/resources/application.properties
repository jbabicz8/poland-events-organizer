spring.application.name=events-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/events
spring.datasource.username=events
spring.datasource.password=events

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:dev-tylko-na-test-zmien-to-w-produkcji-1234567890}
app.jwt.expiration-minutes=120

spring.mail.host=localhost
spring.mail.port=1025

app.frontend-url=http://localhost:5173
app.mail.from=no-reply@events.local

app.upload-dir=${UPLOAD_DIR:./uploads}

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB